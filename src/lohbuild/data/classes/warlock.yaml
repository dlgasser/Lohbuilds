# Warlock class data — Diablo 4 Lord of Hatred
#
# Skill names and categories come from WebSearch summaries of maxroll.gg and
# the Blizzard reveal blog (see CLAUDE.md). Per-skill numeric values
# (cooldown, cast time, resource cost, scaling) and ALL modifier data were
# NOT scraped from a live page — direct fetches to maxroll / d4builds /
# wowhead / Blizzard returned HTTP 403. Numbers are best-effort placeholders.
#
# Every entry carries `placeholder: true` until verified against an in-game
# tooltip. The optimizer marks any placeholder skill, passive, or modifier
# in its report.
#
# User-confirmed rules (2026-04-25):
#   - every active skill has max_rank 15
#   - each modifier / variant pick costs 1 point and has no rank (binary)
#   - within a skill's (slot) you pick at most one modifier
#   - the four slots are: left, right, middle, bonus

