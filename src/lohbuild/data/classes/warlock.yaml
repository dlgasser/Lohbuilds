# Warlock class data — Diablo 4 Lord of Hatred
#
# Skill names, base damage %, lucky-hit chance, cooldowns, AoE shape,
# Hellfire/Abyss school assignment, and modifier names are sourced from the
# Maxroll Warlock class overview (downloaded HTML, parsed 2026-04-26):
#   https://maxroll.gg/d4/getting-started/warlock-class-overview
#
# `placeholder: true` is now used selectively. The skill structural data
# (name, damage_pct, lucky_hit, cooldown, aoe, school) is NOT placeholder
# where Maxroll quoted it. Modifier stat values ARE placeholder — the real
# effects are conditional / situational (e.g. "x50% damage when..." with
# a trigger), and the StatBlock we have today only models flat multipliers,
# so the stats below are conservative best-effort approximations.
#
# Per-skill rank-scaling (`per_rank_increment`) is not in the Maxroll
# overview; held at 0.10 / rank pending datamines.
#
# User-confirmed rules (re-stated):
#   - every active skill has max_rank 15
#   - each modifier pick costs 1 point and has no rank
#   - 3 slots per skill: enhance1 (1 of 2), enhance2 (1 of 2), variant (1 of 3)
#   - only one ultimate skill can be selected (Maxroll: "Only one can be chosen")

class_id: warlock
name: Warlock

