# Warlock class data — Diablo 4 Lord of Hatred
#
# Skill names and skill categories were taken from WebSearch summaries of
# maxroll.gg and other public sources (see CLAUDE.md). Per-skill numeric
# values (cooldown, cast time, resource cost, scaling) were NOT scraped from a
# live page — direct fetches to maxroll.gg / d4builds.gg / wowhead returned
# HTTP 403. They are populated with best-effort values from search snippets
# where available, and otherwise with conservative placeholders.
#
# Every entry carries `placeholder: true` until a real numeric source is
# verified end-to-end against the in-game tooltip. The optimizer marks any
# placeholder skill or passive in its report.
#
# User-confirmed rule (2026-04-25): every active skill has max_rank 15.
# Secondary modifier / variant nodes are NOT raised; we do not model variants
# yet, so this file simply sets max_rank: 15 on the ten active skills below.

class_id: warlock
name: Warlock

