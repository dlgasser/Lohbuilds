# Lord of Hatred removes all passive nodes from class skill trees. Passive-
# style power is now sourced from Legendary Aspects, Uniques, and the new
# Talisman + Charms system — none of which are modeled here yet. We keep an
# empty `passives:` list so the loader and optimizer continue to work; populate
# it only if a future patch reintroduces tree passives.
#
# Source: https://news.blizzard.com/en-us/article/24267729/prepare-for-the-reckoning-lord-of-hatred-draws-near
